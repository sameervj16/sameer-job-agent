<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sameer's Job Agent</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;color:#172033}
header{background:#111827;color:#fff;padding:28px 6%}main{max-width:1100px;margin:25px auto;padding:0 18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.job{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}
.job{margin:12px 0}.score{font-weight:800;font-size:20px}.tag{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:99px;margin:3px;font-size:12px}
.button{display:inline-block;background:#111827;color:#fff;padding:9px 14px;border-radius:9px;text-decoration:none;margin-top:10px}
small{color:#667085}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><header><h1>Sameer's Job Agent</h1><div>AI/GenAI • Technical Support • Solutions • Bengaluru/India Remote</div></header>
<main><div class="cards">
<div class="card"><small>Minimum fit</small><h2 id="minfit">80%</h2></div>
<div class="card"><small>Jobs found</small><h2 id="total">—</h2></div>
<div class="card"><small>90%+ fit</small><h2 id="high">—</h2></div>
<div class="card"><small>Last scan</small><h2 id="date">—</h2></div>
</div><div id="jobs"><p>Run the GitHub Action to load jobs.</p></div></main>
<script>
fetch("jobs.json").then(r=>r.json()).then(d=>{
minfit.textContent=d.min_fit+"%";total.textContent=d.jobs.length;high.textContent=d.jobs.filter(x=>x.fit>=90).length;date.textContent=d.generated_at.slice(0,10);
const b=document.getElementById("jobs");b.innerHTML="";
d.jobs.forEach(j=>{let e=document.createElement("div");e.className="job";e.innerHTML="<div class='score'>"+j.fit+"% match</div><h2>"+esc(j.title)+"</h2><b>"+esc(j.company)+"</b> · "+esc(j.location)+"<p>"+esc(j.reason)+"</p>"+(j.tags||[]).map(t=>"<span class='tag'>"+esc(t)+"</span>").join("")+"<br><a class='button' target='_blank' href='"+j.url+"'>Apply / View job</a>";b.appendChild(e)});
}).catch(()=>{});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
