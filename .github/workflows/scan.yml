name: Job Agent Scan

on:
  workflow_dispatch:
  schedule:
    # 9:00 AM IST
    - cron: "30 3 * * *"

    # 7:00 PM IST
    - cron: "30 13 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan jobs
        run: |
          cat > scanner.py <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          CONFIG_FILE = "config.json"
          OUTPUT_FILE = "jobs.json"

          # =========================================================
          # LOAD CONFIG
          # =========================================================

          with open(CONFIG_FILE, "r", encoding="utf-8") as f:
              config = json.load(f)

          PROFILE = config.get("profile", {})

          # v3 intentionally uses 70 as the discovery threshold.
          # Jobs are still ranked by score.
          MIN_FIT = 70

          MAX_EXP = config.get(
              "max_experience_years",
              5
          )

          DAILY_CAP = config.get(
              "daily_review_cap",
              30
          )

          CONFIG_TARGET_TITLES = [
              str(x).lower().strip()
              for x in config.get("target_titles", [])
          ]

          CONFIG_ALIASES = [
              str(x).lower().strip()
              for x in config.get("title_aliases", [])
          ]

          CONFIG_EXCLUDE_TITLES = [
              str(x).lower().strip()
              for x in config.get("hard_exclude_title", [])
          ]

          CONFIG_EXCLUDE_TERMS = [
              str(x).lower().strip()
              for x in config.get("hard_exclude_terms", [])
          ]

          CONFIG_SKILLS = [
              str(x).lower().strip()
              for x in config.get("positive_skills", [])
          ]

          # =========================================================
          # SAMEER-SPECIFIC ROLE FILTERS
          # =========================================================

          # Roles that are clearly outside Sameer's target.
          HARD_EXCLUDE_TITLE_PATTERNS = [
              "full stack engineer",
              "full-stack engineer",
              "frontend engineer",
              "front end engineer",
              "backend engineer",
              "back end engineer",
              "software developer",
              "software development engineer",
              "software engineer",
              "web developer",
              "mobile developer",
              "data scientist",
              "data engineer",
              "machine learning engineer",
              "deep learning engineer",
              "ml engineer",
              "devops engineer",
              "site reliability engineer",
              "sre",
              "qa engineer",
              "test engineer",
              "automation test engineer",
              "embedded engineer",
              "mechanical engineer",
              "electrical engineer",
              "principal engineer",
              "staff engineer",
              "engineering manager",
              "director of engineering",
              "vp engineering",
              "vice president engineering",
              "head of engineering"
          ]

          SENIORITY_TERMS = [
              "principal",
              "staff",
              "director",
              "vice president",
              "vp ",
              "head of",
              "engineering manager"
          ]

          # Pure commercial roles.
          SALES_TITLE_PATTERNS = [
              "account executive",
              "sales development representative",
              "business development representative",
              "sales representative",
              "sales manager",
              "sales director",
              "sales executive",
              "business development manager"
          ]

          # Pure CSM roles.
          PURE_CSM_TITLE_PATTERNS = [
              "customer success manager",
              "customer success director",
              "customer success lead",
              "customer success associate",
              "customer success specialist"
          ]

          # Terms that strongly indicate ERP / finance systems.
          ERP_TERMS = [
              "enterprise resource planning",
              "erp",
              "sap",
              "oracle erp",
              "oracle fusion",
              "oracle ebs",
              "intacct",
              "accounting system",
              "accounting software",
              "payroll system",
              "finance system",
              "financial accounting",
              "accounts payable",
              "accounts receivable"
          ]

          # Strong commercial signals.
          SALES_TERMS = [
              "sales quota",
              "sales target",
              "commission-based",
              "commission only",
              "quota carrying",
              "quota-carrying",
              "closing deals",
              "new logo acquisition",
              "sales pipeline",
              "revenue target",
              "prospecting",
              "cold calling"
          ]

          # =========================================================
          # TARGET ROLE FAMILY
          # =========================================================

          TARGET_ROLE_FAMILIES = [
              "technical support",
              "application support",
              "product support",
              "customer support engineer",
              "support engineer",
              "support analyst",
              "technical support engineer",
              "application support engineer",
              "product support engineer",
              "product support specialist",
              "ai support",
              "ai support engineer",
              "ai solutions engineer",
              "solutions engineer",
              "solutions consultant",
              "implementation engineer",
              "implementation specialist",
              "integration engineer",
              "integration specialist",
              "customer success engineer",
              "technical account manager",
              "technical account engineer",
              "voice ai engineer",
              "voice engineer",
              "conversational ai engineer",
              "conversation ai engineer",
              "conversational ai",
              "agent engineer",
              "ai agent engineer",
              "genai engineer",
              "generative ai engineer",
              "ai platform support",
              "ai operations",
              "ai operations engineer",
              "llm support",
              "llm engineer",
              "forward deployed engineer",
              "customer engineer"
          ]

          # =========================================================
          # HELPERS
          # =========================================================

          def normalize(value):
              value = str(value or "")
              value = value.lower()
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def contains(text, term):
              return normalize(term) in normalize(text)


          def count_terms(text, terms):
              text = normalize(text)

              count = 0

              for term in terms:
                  term = normalize(term)

                  if term and term in text:
                      count += 1

              return count


          def unique(items):
              return list(dict.fromkeys(items))


          # =========================================================
          # FETCH JSON
          # =========================================================

          def fetch_json(url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Sameer-Job-Agent/3.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      return json.loads(data)

              except Exception as exc:
                  print(
                      f"WARNING: Could not fetch {url}: {exc}"
                  )

                  return None


          # =========================================================
          # GREENHOUSE SOURCES
          # =========================================================

          GREENHOUSE_BOARDS = [
              "sarvam-ai",
              "kognitos",
              "abnormal-security",
              "cresta"
          ]


          def get_greenhouse_jobs():

              jobs = []

              for board in GREENHOUSE_BOARDS:

                  url = (
                      "https://boards-api.greenhouse.io/v1/boards/"
                      + board
                      + "/jobs?content=true"
                  )

                  data = fetch_json(url)

                  if not data:
                      continue

                  for job in data.get("jobs", []):

                      location_data = (
                          job.get("location") or {}
                      )

                      jobs.append({
                          "title": job.get(
                              "title",
                              ""
                          ),

                          "company": board,

                          "location": location_data.get(
                              "name",
                              ""
                          ),

                          "url": job.get(
                              "absolute_url",
                              ""
                          ),

                          "description": job.get(
                              "content",
                              ""
                          ),

                          "updated_at": job.get(
                              "updated_at"
                          ),

                          "created_at": None,

                          "source": "Greenhouse"
                      })

              return jobs


          # =========================================================
          # LEVER SOURCES
          # =========================================================

          LEVER_BOARDS = [
              "locus-sh",
              "deepgram"
          ]


          def get_lever_jobs():

              jobs = []

              for board in LEVER_BOARDS:

                  url = (
                      "https://api.lever.co/v0/postings/"
                      + board
                      + "?mode=json"
                  )

                  data = fetch_json(url)

                  if not data:
                      continue

                  for job in data:

                      categories = (
                          job.get(
                              "categories",
                              {}
                          ) or {}
                      )

                      description = (
                          job.get(
                              "descriptionPlain"
                          )
                          or job.get(
                              "description"
                          )
                          or ""
                      )

                      jobs.append({
                          "title": job.get(
                              "text",
                              ""
                          ),

                          "company": board,

                          "location": categories.get(
                              "location",
                              ""
                          ),

                          "url": job.get(
                              "hostedUrl",
                              ""
                          ),

                          "description": description,

                          "updated_at": None,

                          "created_at": job.get(
                              "createdAt"
                          ),

                          "source": "Lever"
                      })

              return jobs


          # =========================================================
          # TITLE SCORING
          # =========================================================

          def score_title(title):

              title = normalize(title)

              # -----------------------------------------------
              # Hard exclusions from config
              # -----------------------------------------------

              for term in CONFIG_EXCLUDE_TITLES:

                  if term and term in title:

                      return (
                          -100,
                          "Excluded by configured title rule"
                      )

              # -----------------------------------------------
              # Hard engineering exclusions
              # -----------------------------------------------

              for term in HARD_EXCLUDE_TITLE_PATTERNS:

                  if term in title:

                      return (
                          -100,
                          "Unrelated/deep engineering role"
                      )

              # -----------------------------------------------
              # Pure sales
              # -----------------------------------------------

              for term in SALES_TITLE_PATTERNS:

                  if term in title:

                      return (
                          -100,
                          "Pure sales role"
                      )

              # -----------------------------------------------
              # Pure CSM
              # -----------------------------------------------

              for term in PURE_CSM_TITLE_PATTERNS:

                  if term in title:

                      return (
                          -100,
                          "Pure customer success management role"
                      )

              # -----------------------------------------------
              # Seniority
              # -----------------------------------------------

              for term in SENIORITY_TERMS:

                  if term in title:

                      # Senior support/solutions roles can remain
                      # visible for manual review.
                      allowed_senior = [
                          "technical support",
                          "application support",
                          "product support",
                          "support engineer",
                          "solutions engineer",
                          "implementation",
                          "integration",
                          "customer success engineer",
                          "technical account",
                          "customer engineer"
                      ]

                      if not any(
                          x in title
                          for x in allowed_senior
                      ):

                          return (
                              -100,
                              "Senior/management role"
                          )

              # -----------------------------------------------
              # Exact configured targets
              # -----------------------------------------------

              if title in CONFIG_TARGET_TITLES:

                  return (
                      45,
                      "Exact target title"
                  )

              # -----------------------------------------------
              # Configured target phrases
              # -----------------------------------------------

              if any(
                  x in title
                  for x in CONFIG_TARGET_TITLES
                  if x
              ):

                  return (
                      42,
                      "Target role"
                  )

              # -----------------------------------------------
              # Configured aliases
              # -----------------------------------------------

              if any(
                  x in title
                  for x in CONFIG_ALIASES
                  if x
              ):

                  return (
                      38,
                      "Related target role"
                  )

              # -----------------------------------------------
              # Built-in target families
              # -----------------------------------------------

              if any(
                  x in title
                  for x in TARGET_ROLE_FAMILIES
              ):

                  return (
                      35,
                      "Preferred role family"
                  )

              # -----------------------------------------------
              # Useful generic technical titles
              # -----------------------------------------------

              useful_generic = [
                  "technical analyst",
                  "support analyst",
                  "implementation analyst",
                  "integration analyst",
                  "technical consultant",
                  "application analyst"
              ]

              if any(
                  x in title
                  for x in useful_generic
              ):

                  return (
                      28,
                      "Potentially relevant technical role"
                  )

              # -----------------------------------------------
              # Unknown title
              # -----------------------------------------------

              return (
                  -20,
                  "Title not strongly aligned"
              )


          # =========================================================
          # LOCATION SCORING
          # =========================================================

          def score_location(location):

              location = normalize(location)

              # -----------------------------------------------
              # India
              # -----------------------------------------------

              india_terms = [
                  "bengaluru",
                  "bangalore",
                  "india",
                  "remote india",
                  "india remote"
              ]

              if any(
                  x in location
                  for x in india_terms
              ):

                  return (
                      8,
                      "India-compatible"
                  )

              # -----------------------------------------------
              # Explicit worldwide / anywhere
              # -----------------------------------------------

              worldwide_terms = [
                  "worldwide",
                  "global remote",
                  "work from anywhere",
                  "anywhere in the world"
              ]

              if any(
                  x in location
                  for x in worldwide_terms
              ):

                  return (
                      8,
                      "Worldwide remote"
                  )

              # -----------------------------------------------
              # US restricted
              # -----------------------------------------------

              us_terms = [
                  "united states",
                  "united states remote",
                  "usa only",
                  "us only",
                  "u.s. only",
                  "us remote"
              ]

              if any(
                  x in location
                  for x in us_terms
              ):

                  return (
                      -100,
                      "US-only location"
                  )

              # -----------------------------------------------
              # Other restricted locations
              # -----------------------------------------------

              restricted_terms = [
                  "united kingdom only",
                  "uk only",
                  "canada only",
                  "australia only",
                  "singapore only",
                  "europe only",
                  "eu only",
                  "european union only"
              ]

              if any(
                  x in location
                  for x in restricted_terms
              ):

                  return (
                      -100,
                      "Restricted international location"
                  )

              # -----------------------------------------------
              # Generic remote
              # -----------------------------------------------

              if "remote" in location:

                  return (
                      2,
                      "Remote - India eligibility unclear"
                  )

              return (
                  0,
                  "Location not specified as India"
              )


          # =========================================================
          # EXPERIENCE SCORING
          # =========================================================

          def score_experience(text):

              text = normalize(text)

              # -----------------------------------------------
              # Explicit X+ years
              # -----------------------------------------------

              patterns = [
                  r"(\d+)\s*\+\s*years",
                  r"minimum of\s*(\d+)\s*years",
                  r"at least\s*(\d+)\s*years",
                  r"(\d+)\s*or more\s*years"
              ]

              for pattern in patterns:

                  matches = re.findall(
                      pattern,
                      text
                  )

                  for value in matches:

                      years = int(value)

                      if years > MAX_EXP:

                          return (
                              -20,
                              f"Requires {years}+ years"
                          )

                      if years == 5:

                          return (
                              5,
                              "Approximately 5 years"
                          )

                      if years <= 4:

                          return (
                              10,
                              f"Requires {years} years"
                          )

              # -----------------------------------------------
              # Experience ranges
              # -----------------------------------------------

              ranges = re.findall(
                  r"(\d+)\s*[-–]\s*(\d+)\s*years",
                  text
              )

              for low, high in ranges:

                  low = int(low)
                  high = int(high)

                  if low <= 4:

                      return (
                          10,
                          f"Experience range {low}-{high} years"
                      )

                  if low > MAX_EXP:

                      return (
                          -20,
                          f"Requires {low}+ years"
                      )

              # -----------------------------------------------
              # No explicit requirement
              # -----------------------------------------------

              return (
                  5,
                  "Experience requirement unclear"
              )


          # =========================================================
          # DOMAIN / JOB CONTENT ANALYSIS
          # =========================================================

          def analyze_content(title, description):

              title = normalize(title)
              description = normalize(description)

              text = title + " " + description

              # -----------------------------------------------
              # ERP check
              # -----------------------------------------------

              for term in ERP_TERMS:

                  if term in text:

                      # Ignore weak incidental references.
                      # Strong ERP indicators should reject.
                      strong_erp = [
                          "erp",
                          "sap",
                          "oracle erp",
                          "oracle fusion",
                          "oracle ebs",
                          "intacct",
                          "accounting system",
                          "accounting software",
                          "payroll system",
                          "finance system",
                          "accounts payable",
                          "accounts receivable"
                      ]

                      if term in strong_erp:

                          return (
                              True,
                              "ERP/finance domain"
                          )

              # -----------------------------------------------
              # Pure sales content
              # -----------------------------------------------

              sales_hits = count_terms(
                  text,
                  SALES_TERMS
              )

              if sales_hits >= 4:

                  return (
                      True,
                      "Strong sales/quota requirement"
                  )

              return (
                  False,
                  ""
              )


          # =========================================================
          # SKILL MATCHING
          # =========================================================

          def get_skill_matches(text):

              text = normalize(text)

              matches = []

              for skill in CONFIG_SKILLS:

                  if skill and skill in text:

                      matches.append(skill)

              # Additional important profile skills
              additional_skills = [
                  "rest api",
                  "rest apis",
                  "api troubleshooting",
                  "postman",
                  "json",
                  "webhooks",
                  "webhook",
                  "production support",
                  "incident management",
                  "root cause analysis",
                  "rca",
                  "sla",
                  "customer support",
                  "technical support",
                  "llm",
                  "genai",
                  "generative ai",
                  "ai agent",
                  "ai agents",
                  "agentic ai",
                  "claude",
                  "model context protocol",
                  "mcp",
                  "prompt engineering",
                  "voice ai",
                  "conversational ai",
                  "ivr",
                  "ssml",
                  "salesforce",
                  "sql",
                  "python",
                  "aws",
                  "cloudwatch",
                  "jira",
                  "sumo logic"
              ]

              for skill in additional_skills:

                  if skill in text:

                      matches.append(skill)

              return unique(matches)


          # =========================================================
          # SCORE JOB
          # =========================================================

          def score_job(job):

              title = job.get(
                  "title",
                  ""
              )

              location = job.get(
                  "location",
                  ""
              )

              description = job.get(
                  "description",
                  ""
              )

              full_text = normalize(
                  title + " " + description
              )

              # -----------------------------------------------
              # Title
              # -----------------------------------------------

              title_points, title_reason = score_title(
                  title
              )

              if title_points <= -100:

                  print(
                      "REJECT TITLE:",
                      title
                  )

                  return None

              # -----------------------------------------------
              # Location
              # -----------------------------------------------

              location_points, location_reason = score_location(
                  location
              )

              if location_points <= -100:

                  print(
                      "REJECT LOCATION:",
                      title,
                      "|",
                      location
                  )

                  return None

              # -----------------------------------------------
              # Content exclusions
              # -----------------------------------------------

              rejected, rejection_reason = analyze_content(
                  title,
                  description
              )

              if rejected:

                  print(
                      "REJECT CONTENT:",
                      title,
                      "|",
                      rejection_reason
                  )

                  return None

              # -----------------------------------------------
              # Experience
              # -----------------------------------------------

              experience_points, experience_reason = (
                  score_experience(full_text)
              )

              if experience_points <= -20:

                  print(
                      "REJECT EXPERIENCE:",
                      title,
                      "|",
                      experience_reason
                  )

                  return None

              # -----------------------------------------------
              # Skill matches
              # -----------------------------------------------

              skill_matches = get_skill_matches(
                  full_text
              )

              skill_points = min(
                  len(skill_matches) * 2,
                  24
              )

              # -----------------------------------------------
              # High-value combinations
              # -----------------------------------------------

              bonus = 0

              # API + support
              if (
                  "api" in full_text
                  and (
                      "support" in full_text
                      or "troubleshoot" in full_text
                  )
              ):

                  bonus += 5

              # AI + support
              if (
                  (
                      "ai" in full_text
                      or "llm" in full_text
                      or "generative ai" in full_text
                  )
                  and (
                      "support" in full_text
                      or "customer" in full_text
                  )
              ):

                  bonus += 5

              # Voice/conversational AI
              if (
                  "voice ai" in full_text
                  or "conversational ai" in full_text
                  or "ivr" in full_text
                  or "ssml" in full_text
              ):

                  bonus += 5

              # Customer-facing technical work
              customer_terms = [
                  "customer-facing",
                  "customer facing",
                  "enterprise customers",
                  "customer support",
                  "technical support",
                  "client support",
                  "customer issues",
                  "customer escalations"
              ]

              customer_hits = count_terms(
                  full_text,
                  customer_terms
              )

              if customer_hits >= 2:

                  bonus += 5

              # Integration/API work
              integration_terms = [
                  "integration",
                  "api",
                  "webhook",
                  "rest",
                  "postman"
              ]

              if count_terms(
                  full_text,
                  integration_terms
              ) >= 3:

                  bonus += 4

              # -----------------------------------------------
              # Final score
              # -----------------------------------------------

              score = (
                  title_points
                  + skill_points
                  + experience_points
                  + location_points
                  + bonus
              )

              score = max(
                  0,
                  min(100, score)
              )

              # -----------------------------------------------
              # Quality
              # -----------------------------------------------

              if score >= 90:

                  quality = "Excellent match"

              elif score >= 80:

                  quality = "Strong match"

              elif score >= 70:

                  quality = "Review"

              else:

                  quality = "Weak match"

              # -----------------------------------------------
              # Minimum discovery threshold
              # -----------------------------------------------

              if score < MIN_FIT:

                  return None

              # -----------------------------------------------
              # Tags
              # -----------------------------------------------

              tags = []

              if title_points >= 40:

                  tags.append(
                      "Target role"
                  )

              elif title_points >= 35:

                  tags.append(
                      "Preferred role"
                  )

              if any(
                  x in full_text
                  for x in [
                      "ai",
                      "llm",
                      "genai",
                      "generative ai",
                      "claude",
                      "agentic ai",
                      "ai agent"
                  ]
              ):

                  tags.append(
                      "AI/GenAI"
                  )

              if "api" in full_text:

                  tags.append(
                      "API"
                  )

              if (
                  "support" in full_text
                  or "troubleshoot" in full_text
              ):

                  tags.append(
                      "Support"
                  )

              if (
                  "voice ai" in full_text
                  or "conversational ai" in full_text
                  or "ivr" in full_text
                  or "ssml" in full_text
              ):

                  tags.append(
                      "Voice/Conversational AI"
                  )

              if (
                  "solution" in normalize(title)
                  or "implementation" in normalize(title)
                  or "integration" in normalize(title)
              ):

                  tags.append(
                      "Solutions/Implementation"
                  )

              if location_points >= 8:

                  tags.append(
                      "India-compatible"
                  )

              elif "remote" in normalize(location):

                  tags.append(
                      "Remote eligibility unclear"
                  )

              if experience_points >= 10:

                  tags.append(
                      "Experience aligned"
                  )

              tags = unique(tags)

              # -----------------------------------------------
              # Human-readable reason
              # -----------------------------------------------

              reasons = [
                  title_reason,
                  experience_reason,
                  location_reason
              ]

              if skill_matches:

                  reasons.append(
                      f"{len(skill_matches)} relevant skill matches"
                  )

              if bonus:

                  reasons.append(
                      f"{bonus} profile-alignment bonus"
                  )

              # -----------------------------------------------
              # Result
              # -----------------------------------------------

              return {
                  "title": title,
                  "company": job.get(
                      "company",
                      ""
                  ),
                  "location": location,
                  "url": job.get(
                      "url",
                      ""
                  ),
                  "fit": score,
                  "quality": quality,
                  "reason": "; ".join(reasons),
                  "tags": tags,
                  "matched_skills": skill_matches[:20],
                  "source": job.get(
                      "source",
                      ""
                  ),
                  "updated_at": job.get(
                      "updated_at"
                  ),
                  "created_at": job.get(
                      "created_at"
                  )
              }


          # =========================================================
          # RUN SCAN
          # =========================================================

          print("=" * 70)
          print("SAMEER JOB AGENT v3")
          print("=" * 70)

          print(
              "Profile:",
              PROFILE.get(
                  "name",
                  "Sameer Joshi"
              )
          )

          print(
              "Location:",
              PROFILE.get(
                  "location",
                  "Bengaluru, India"
              )
          )

          print(
              "Experience:",
              PROFILE.get(
                  "experience_years",
                  3.75
              ),
              "years"
          )

          print(
              "Minimum discovery score:",
              MIN_FIT
          )

          print("=" * 70)

          greenhouse_jobs = get_greenhouse_jobs()

          lever_jobs = get_lever_jobs()

          all_jobs = (
              greenhouse_jobs
              + lever_jobs
          )

          print(
              "Greenhouse jobs:",
              len(greenhouse_jobs)
          )

          print(
              "Lever jobs:",
              len(lever_jobs)
          )

          print(
              "Total jobs fetched:",
              len(all_jobs)
          )

          # =========================================================
          # SCORE + DEDUPLICATE
          # =========================================================

          results = []

          seen_urls = set()

          for job in all_jobs:

              result = score_job(job)

              if not result:

                  continue

              url = result.get(
                  "url",
                  ""
              ).strip()

              if not url:

                  continue

              if url in seen_urls:

                  continue

              seen_urls.add(url)

              results.append(result)

          # =========================================================
          # SORT
          # =========================================================

          results.sort(
              key=lambda x: (
                  x.get("fit", 0),
                  x.get("title", "")
              ),
              reverse=True
          )

          results = results[:DAILY_CAP]

          # =========================================================
          # OUTPUT
          # =========================================================

          output = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "scanner_version": "3.0",

              "min_fit": MIN_FIT,

              "profile": {
                  "name": PROFILE.get(
                      "name",
                      "Sameer Joshi"
                  ),

                  "location": PROFILE.get(
                      "location",
                      "Bengaluru, India"
                  ),

                  "experience_years": PROFILE.get(
                      "experience_years",
                      3.75
                  )
              },

              "summary": {
                  "jobs_fetched": len(all_jobs),
                  "jobs_matching": len(results),
                  "daily_review_cap": DAILY_CAP
              },

              "jobs": results
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("=" * 70)
          print(
              "MATCHING JOBS:",
              len(results)
          )
          print("=" * 70)

          for job in results:

              print(
                  f"[{job['fit']}] "
                  f"{job['title']} | "
                  f"{job['company']} | "
                  f"{job['location']}"
              )

          print("=" * 70)
          print("Scan complete.")
          print("=" * 70)

          PY

          python scanner.py

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "Update job matches - v3"
            git push
          fi
